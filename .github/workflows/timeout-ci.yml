name: Timeout Error Dataset

on:
  push:
    paths:
      - 'test_app.py'
jobs:
  timeout-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Tests
        timeout-minutes: 1
        run: |
          pytest test_app.py
