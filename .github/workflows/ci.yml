name: Success Dataset

on:
  push:

jobs:
  dependency-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Selected Dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install pytest
        run: python -m pip install "pytest>=8.0,<9.0"

      - name: Compile Python Sources
        run: |
          python -m compileall -q automation app.py generate_successes.py test_app.py test_workflow.py
          echo "Python syntax/compilation checks passed"

      - name: Run Test Suite
        run: python -m pytest -q
