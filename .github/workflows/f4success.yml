name: F4 Success Dataset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f4-success:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Successful Control Test
        run: |
          mkdir -p f4_success
          cat > f4_success/test_valid_configuration.py <<'EOF'
          def test_valid_configuration():
              assert 1 + 1 == 2
          EOF
          pytest -v f4_success/test_valid_configuration.py
